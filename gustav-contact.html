<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Us - Gustav's Pizza</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>Contact Us</h1>
<p>Send us a general message. We'd love to hear from you!</p>

<!-- FORM STARTS HERE -->
<form id="contactForm" class="pizza-form">
<div class="form-group">
<label for="conName">Your Name:</label>
<input type="text" id="conName" name="name" required>
<span class="error-msg" id="conNameError"></span>
</div>

<div class="form-group">
<label for="conEmail">Email Address:</label>
<input type="email" id="conEmail" name="email" required>
<span class="error-msg" id="conEmailError"></span>
</div>

<div class="form-group">
<label for="conPhone">Phone Number:</label>
<!-- Pattern ensures only numbers and specific lengths are allowed -->
<input type="tel" id="conPhone" name="phone" pattern="[0-9]{10}" placeholder="e.g., 0821234567" required>
<span class="error-msg" id="phoneError"></span>
</div>

<div class="form-group">
<label for="conMessage">Your Message:</label>
<textarea id="conMessage" name="message" rows="5" required></textarea>
<span class="error-msg" id="msgError"></span>
</div>

<button type="submit" class="btn">Send Message</button>
<p id="conSuccessMsg" style="color: green; font-weight: bold; display: none;"></p>
</form>

<script src="js/inquiry.js"></script>
</body>
</html>
